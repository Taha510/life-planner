kind = "mobile"
previewPath = "/life-planner-mobile/"
title = "Life Planner Mobile"
description = "A native iOS and Android personal planner with editable daily schedules, topics, checklists, date-range tracking, progress, streaks, and an offline calendar."
version = "1.0.0"
id = "artifacts/life-planner-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/life-planner-mobile/" ]
localPort = 20706

[services.development]
run = "pnpm --filter @workspace/life-planner-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/life-planner-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/life-planner-mobile", "run", "serve" ]

[services.env]
PORT = "20706"
BASE_PATH = "/life-planner-mobile/"
