<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Life Planner</title>
    <meta name="description" content="Your personal daily planner, progress tracker, and calendar. Works offline and saves on this device." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Life Planner" />
    <meta property="og:description" content="Your personal daily planner, progress tracker, and calendar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Life Planner" />
    <meta name="twitter:description" content="Your personal daily planner, progress tracker, and calendar." />
    <meta name="theme-color" content="#6c5ce7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Life Planner" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./planner-icon.svg" />
    <link rel="apple-touch-icon" href="./planner-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .catch((error) => console.error("Offline support could not start:", error));
        });
      }
    </script>
  </body>
</html>
